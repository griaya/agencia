        <input type="text" name="name" id="name" placeholder="Coloque aquí su nombre" required>

        <label for="correo">Correo Electrónico:</label>
        <input type="email" name="email" id="correo" placeholder="Coloque aquì su correo" required>

        <label for="mensaje">Mensaje:</label>
        <textarea name="message" id="mensaje" cols "30" rows "20"></textarea>

        <button type="submit">ENVIAR</button>

    </form>
